name: CPU tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-cpu.txt
      - name: Run offline CPU tests
        run: make -j2 test-cpu CXX=g++ PYTHON=python SANITIZERS='-fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Install optional CPU reference dependency
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'safetensors>=0.4,<1'
      - name: Run synthetic codec reference tests
        run: make test-reference PYTHON=python

# GPU gates need the dedicated machine, checkpoints, and the shared queue.
# Never run untrusted pull-request code on that machine through this workflow.
